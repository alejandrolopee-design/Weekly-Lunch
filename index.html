<!DOCTYPE html>

  lavender:{50:'#f4f2ff',100:'#ebe7ff',200:'#d8d0ff',300:'#bbb0ff',400:'#9580ff',500:'#7554f0'},
  amber:{50:'#fffbeb',100:'#fef3c7',200:'#fde68a',300:'#fcd34d',400:'#fbbf24',500:'#f59e0b'},

<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:#fdfcf8;color:#2a2a2a;min-height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#c2d7c2;border-radius:99px}

/* Nav */
.nav-btn{position:relative;transition:color .2s}
.nav-btn::after{content:'';position:absolute;bottom:-5px;left:0;right:0;height:2px;background:#3d7a3d;transform:scaleX(0);transform-origin:left;transition:transform .25s ease}
.nav-btn.active{color:#3d7a3d;font-weight:600}
.nav-btn.active::after{transform:scaleX(1)}

/* Cards */
.postit{background:#fff;border:1.5px solid #e4d8be;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);transition:transform .18s,box-shadow .18s}
.postit:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.slot-empty{border:2px dashed #c2d7c2;border-radius:12px;background:#f3f7f3;cursor:pointer;transition:background .15s,border-color .15s}
.slot-empty:hover{background:#e1ebe1;border-color:#5f9b5f}

/* Progress bars */
.prog-wrap{height:7px;border-radius:99px;background:#e4d8be;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;transition:width .45s ease}
.prog-green{background:linear-gradient(90deg,#5f9b5f,#94bb94)}
.prog-orange{background:linear-gradient(90deg,#f59e0b,#fcd34d)}
.prog-red{background:linear-gradient(90deg,#ef4444,#f87171)}
.prog-neutral{background:linear-gradient(90deg,#9580ff,#bbb0ff)}

/* Tags */
.tag{font-size:.68rem;padding:2px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.tag-kcal{background:#ffe8de;color:#f05a25}
.tag-prot{background:#e1ebe1;color:#2d5e2d}
.tag-hc{background:#ebe7ff;color:#5534c8}
.tag-fat{background:#f0e9d8;color:#8a6a3a}
.tag-cat-desayuno{background:#fef3c7;color:#b45309}
.tag-cat-comida{background:#e1ebe1;color:#2d5e2d}
.tag-cat-cena{background:#ebe7ff;color:#5534c8}
.tag-cat-snack{background:#ffe8de;color:#c2410c}

/* Source badges */
.badge-basic{background:#e1ebe1;color:#3d7a3d;font-size:.62rem;padding:1px 6px;border-radius:99px;font-weight:700}
.badge-saved{background:#ebe7ff;color:#5534c8;font-size:.62rem;padding:1px 6px;border-radius:99px;font-weight:700}

/* Category pill row */
.cat-pill{border:1.5px solid #e4d8be;border-radius:99px;padding:4px 12px;font-size:.75rem;cursor:pointer;transition:all .15s;background:#fff}
.cat-pill.active{border-color:#5f9b5f;background:#e1ebe1;color:#2d5e2d;font-weight:600}

/* Modal */
#modal-backdrop{backdrop-filter:blur(5px);background:rgba(30,30,30,.45)}
input:focus,select:focus,textarea:focus{outline:none;box-shadow:0 0 0 3px rgba(95,155,95,.3)}

/* Grid */
#days-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.75rem}
@media(max-width:700px){#days-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:701px) and (max-width:1024px){#days-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Animations */
.fade-in{animation:fadeIn .28s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a2a2a;color:#fff;padding:9px 18px;border-radius:99px;font-size:.83rem;pointer-events:none;opacity:0;transition:opacity .22s;z-index:9999;white-space:nowrap}
#toast.show{opacity:1}

/* Search result cards */
.ing-card{border-radius:11px;padding:7px 9px;display:flex;align-items:center;gap:8px;font-size:.73rem}
.ing-card-basic{background:#f3f7f3}
.ing-card-saved{background:#f4f2ff}

/* Calorie ring feedback colors */
.day-ok .day-header-dot{background:#5f9b5f}
.day-low .day-header-dot{background:#f59e0b}
.day-over .day-header-dot{background:#ef4444}
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header class="sticky top-0 z-40 bg-cream-50/95 backdrop-blur border-b border-cream-300">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 bg-sage-400 rounded-xl flex items-center justify-center shadow-sm">
        <i data-lucide="leaf" class="w-4 h-4 text-white"></i>
      </div>
      <span class="font-display text-xl font-medium text-sage-600">NutriPlan</span>
    </div>
    <nav class="flex items-center gap-5 text-sm text-gray-500">
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="meals">Mis Comidas</button>
      <button class="nav-btn" data-view="menus">Menús</button>
      <button class="nav-btn" data-view="profile">Perfil</button>
    </nav>
    <div id="header-kcal" class="hidden sm:flex items-center gap-1 text-xs bg-sage-100 text-sage-600 px-3 py-1 rounded-full font-semibold">
      <i data-lucide="flame" class="w-3 h-3"></i>
      <span id="header-kcal-text">— kcal</span>
    </div>
  </div>
</header>

<!-- ═══ MAIN ═══ -->
<main class="max-w-7xl mx-auto px-4 py-5">

  <!-- VIEW: DASHBOARD -->
  <section id="view-dashboard" class="fade-in">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
      <div>
        <h1 class="font-display text-3xl font-light leading-tight">Semana actual</h1>
        <p id="week-label" class="text-sm text-gray-400 mt-0.5"></p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="btn-prev-week" class="w-8 h-8 rounded-xl border border-cream-300 flex items-center justify-center hover:bg-cream-100 transition"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
        <button id="btn-today" class="text-xs px-3 py-1.5 rounded-xl border border-cream-300 hover:bg-cream-100 transition">Hoy</button>
        <button id="btn-next-week" class="w-8 h-8 rounded-xl border border-cream-300 flex items-center justify-center hover:bg-cream-100 transition"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        <button id="btn-shopping-list" class="text-xs px-3 py-2 bg-amber-400 text-white rounded-xl hover:bg-amber-500 transition flex items-center gap-1.5 font-medium">
          <i data-lucide="shopping-cart" class="w-3.5 h-3.5"></i> Lista compra
        </button>
        <button id="btn-apply-menu" class="text-xs px-3 py-2 bg-sage-400 text-white rounded-xl hover:bg-sage-500 transition flex items-center gap-1.5 font-medium">
          <i data-lucide="layout-template" class="w-3.5 h-3.5"></i> Aplicar Menú
        </button>
      </div>
    </div>
    <div id="days-grid" class="mb-8"></div>
  </section>

  <!-- VIEW: MIS COMIDAS -->
  <section id="view-meals" class="fade-in hidden">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
      <h1 class="font-display text-3xl font-light">Mis Comidas</h1>
      <button id="btn-new-meal" class="text-sm px-4 py-2 bg-sage-400 text-white rounded-xl hover:bg-sage-500 transition flex items-center gap-1.5 font-medium">
        <i data-lucide="plus" class="w-4 h-4"></i> Nueva Comida
      </button>
    </div>
    <!-- Category filter -->
    <div class="flex flex-wrap gap-2 mb-5" id="meal-cat-filter">
      <button class="cat-pill active" data-cat="all">Todas</button>
      <button class="cat-pill" data-cat="desayuno">🌅 Desayuno</button>
      <button class="cat-pill" data-cat="comida">🍽️ Comida</button>
      <button class="cat-pill" data-cat="cena">🌙 Cena</button>
      <button class="cat-pill" data-cat="snack">🍎 Snack</button>
    </div>
    <div id="meals-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </section>

  <!-- VIEW: MENÚS -->
  <section id="view-menus" class="fade-in hidden">
    <div class="flex items-center justify-between mb-5">
      <h1 class="font-display text-3xl font-light">Mis Menús</h1>
      <button id="btn-new-menu" class="text-sm px-4 py-2 bg-lavender-400 text-white rounded-xl hover:bg-lavender-500 transition flex items-center gap-1.5 font-medium">
        <i data-lucide="plus" class="w-4 h-4"></i> Nuevo Menú
      </button>
    </div>
    <div id="menus-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </section>

  <!-- VIEW: PERFIL -->
  <section id="view-profile" class="fade-in hidden max-w-xl mx-auto">
    <h1 class="font-display text-3xl font-light mb-5">Perfil &amp; Objetivos</h1>
    <div class="postit p-6 mb-5">
      <h2 class="font-semibold text-gray-700 mb-4 flex items-center gap-2 text-sm">
        <i data-lucide="user-round" class="w-4 h-4 text-sage-400"></i> Datos físicos
      </h2>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-xs text-gray-400 mb-1 block">Edad</label>
          <input id="p-age" type="number" min="10" max="120" placeholder="30" class="w-full border border-cream-300 rounded-xl px-3 py-2 text-sm bg-cream-50"/></div>
        <div><label class="text-xs text-gray-400 mb-1 block">Sexo</label>
          <select id="p-sex" class="w-full border border-cream-300 rounded-xl px-3 py-2 text-sm bg-cream-50">
            <option value="male">Hombre</option><option value="female">Mujer</option>
          </select></div>
        <div><label class="text-xs text-gray-400 mb-1 block">Peso (kg)</label>
          <input id="p-weight" type="number" min="30" max="300" placeholder="70" class="w-full border border-cream-300 rounded-xl px-3 py-2 text-sm bg-cream-50"/></div>
        <div><label class="text-xs text-gray-400 mb-1 block">Altura (cm)</label>
          <input id="p-height" type="number" min="100" max="250" placeholder="170" class="w-full border border-cream-300 rounded-xl px-3 py-2 text-sm bg-cream-50"/></div>
        <div class="col-span-2"><label class="text-xs text-gray-400 mb-1 block">Nivel de actividad</label>
          <select id="p-activity" class="w-full border border-cream-300 rounded-xl px-3 py-2 text-sm bg-cream-50">
            <option value="1.2">Sedentario</option>
            <option value="1.375">Ligero (1-3 días/semana)</option>
            <option value="1.55" selected>Moderado (3-5 días/semana)</option>
            <option value="1.725">Activo (6-7 días/semana)</option>
            <option value="1.9">Muy activo</option>
          </select></div>
      </div>
      <button id="btn-calc-tdee" class="mt-4 w-full py-2 bg-sage-400 text-white rounded-xl text-sm font-semibold hover:bg-sage-500 transition">Calcular objetivo calórico</button>
      <div id="tdee-result" class="mt-3 hidden bg-sage-50 border border-sage-200 rounded-xl p-4 text-sm">
        <p class="font-bold text-sage-600" id="tdee-text"></p>
        <p class="text-gray-400 text-xs mt-0.5" id="bmr-text"></p>
      </div>
    </div>
    <div class="postit p-6">
      <h2 class="font-semibold text-gray-700 mb-4 flex items-center gap-2 text-sm">
        <i data-lucide="chart-pie" class="w-4 h-4 text-lavender-400"></i> Distribución de Macros
      </h2>
      <p class="text-xs text-gray-400 mb-3">Los porcentajes deben sumar 100%.</p>
      <div class="grid grid-cols-3 gap-3">
        <div><label class="text-xs text-gray-400 mb-1 block">Carbos (%)</label>
          <input id="p-carbs-pct" type="number" min="0" max="100" value="50" class="w-full border border-cream-300 rounded-xl px-3 py-2 text-sm bg-cream-50"/></div>
        <div><label class="text-xs text-gray-400 mb-1 block">Proteína (%)</label>
          <input id="p-prot-pct" type="number" min="0" max="100" value="25" class="w-full border border-cream-300 rounded-xl px-3 py-2 text-sm bg-cream-50"/></div>
        <div><label class="text-xs text-gray-400 mb-1 block">Grasas (%)</label>
          <input id="p-fat-pct" type="number" min="0" max="100" value="25" class="w-full border border-cream-300 rounded-xl px-3 py-2 text-sm bg-cream-50"/></div>
      </div>
      <button id="btn-save-profile" class="mt-4 w-full py-2 bg-lavender-400 text-white rounded-xl text-sm font-semibold hover:bg-lavender-500 transition">Guardar perfil</button>
    </div>
  </section>

</main>

<div id="toast"></div>
<div id="modal-backdrop" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden">
  <div id="modal-box" class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] overflow-y-auto"></div>
</div>

  customIngredients:[],

};}

const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2);
const fmt=n=>Number.isFinite(n)?Math.round(n):0;
const isoDate=d=>d.toISOString().split('T')[0];
function toast(msg,dur=2500){const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ');

function weekMonday(d=new Date()){
  const day=d.getDay(),diff=day===0?-6:1-day;
  const m=new Date(d);m.setDate(d.getDate()+diff);m.setHours(0,0,0,0);return m;
}
const weekDates=mon=>Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
const DAY_NAMES=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MONTH_NAMES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

const mealTotals=meal=>(meal.ingredients||[]).reduce(
  (r,i)=>({kcal:r.kcal+i.kcal,prot:r.prot+i.prot,carbs:r.carbs+i.carbs,fat:r.fat+i.fat}),
  {kcal:0,prot:0,carbs:0,fat:0}
);
const getMeal=id=>S.meals.find(m=>m.id===id);

const CAT_LABELS={desayuno:'🌅 Desayuno',comida:'🍽️ Comida',cena:'🌙 Cena',snack:'🍎 Snack'};
const CAT_COLORS={desayuno:'tag-cat-desayuno',comida:'tag-cat-comida',cena:'tag-cat-cena',snack:'tag-cat-snack'};

function searchLocal(q){
  const lq=q.toLowerCase();

  return{basic,custom};
}

/* ═══════════════════════════════════════════
   § 5 — HARRIS-BENEDICT & MACROS
═══════════════════════════════════════════ */
function calcHB({age,sex,weight,height,activity}){
  const bmr=sex==='male'
    ?88.362+13.397*weight+4.799*height-5.677*age
    :447.593+9.247*weight+3.098*height-4.330*age;
  return{bmr:Math.round(bmr),tdee:Math.round(bmr*activity)};
}
function macroGoals(){
  const{tdee,carbsPct,protPct,fatPct}=S.profile;
  if(!tdee)return null;
  return{kcal:tdee,carbs:Math.round(tdee*carbsPct/100/4),prot:Math.round(tdee*protPct/100/4),fat:Math.round(tdee*fatPct/100/9)};
}

$('btn-calc-tdee').addEventListener('click',()=>{
  const age=+$('p-age').value,sex=$('p-sex').value,w=+$('p-weight').value,h=+$('p-height').value,act=+$('p-activity').value;
  if(!age||!w||!h){toast('Completa todos los campos');return;}
  const{bmr,tdee}=calcHB({age,sex,weight:w,height:h,activity:act});
  $('tdee-text').textContent='Objetivo: '+tdee+' kcal/día';
  $('bmr-text').textContent='BMR: '+bmr+' kcal/día';
  $('tdee-result').classList.remove('hidden');
  S.profile._tmpTdee=tdee;S.profile._tmpBmr=bmr;
});

$('btn-save-profile').addEventListener('click',()=>{
  const c=+$('p-carbs-pct').value,pr=+$('p-prot-pct').value,fa=+$('p-fat-pct').value;
  if(c+pr+fa!==100){toast('Los macros deben sumar 100%');return;}
  Object.assign(S.profile,{
    age:+$('p-age').value||S.profile.age,sex:$('p-sex').value,
    weight:+$('p-weight').value||S.profile.weight,
    height:+$('p-height').value||S.profile.height,
    activity:+$('p-activity').value,carbsPct:c,protPct:pr,fatPct:fa,
    tdee:S.profile._tmpTdee||S.profile.tdee,bmr:S.profile._tmpBmr||S.profile.bmr,
  });
  save();toast('✓ Perfil guardado');updateHeaderKcal();
});

function loadProfileForm(){
  const p=S.profile;
  if(p.age)$('p-age').value=p.age;if(p.weight)$('p-weight').value=p.weight;
  if(p.height)$('p-height').value=p.height;
  $('p-sex').value=p.sex;$('p-activity').value=p.activity;
  $('p-carbs-pct').value=p.carbsPct;$('p-prot-pct').value=p.protPct;$('p-fat-pct').value=p.fatPct;
  if(p.tdee){$('tdee-text').textContent='Objetivo: '+p.tdee+' kcal/día';$('bmr-text').textContent='BMR: '+p.bmr+' kcal/día';$('tdee-result').classList.remove('hidden');}
}

function updateHeaderKcal(){
  const goals=macroGoals();if(!goals)return;
  $('header-kcal').classList.remove('hidden');
  const dd=S.weekPlan[isoDate(new Date())];
  let eaten=0;(dd?.slots||[]).forEach(sid=>{const m=getMeal(sid);if(m)eaten+=mealTotals(m).kcal;});
  $('header-kcal-text').textContent=fmt(eaten)+' / '+goals.kcal+' kcal';
}

function showView(name){
  ['dashboard','meals','menus','profile'].forEach(v=>{
    $('view-'+v).classList.toggle('hidden',v!==name);
    $('view-'+v).classList.toggle('fade-in',v===name);
  });
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
  currentView=name;
  if(name==='dashboard')renderDashboard();
  if(name==='meals')renderMeals();
  if(name==='menus')renderMenus();
  if(name==='profile')loadProfileForm();
  refreshUI();
}

/* ═══════════════════════════════════════════
   § 7 — DASHBOARD
═══════════════════════════════════════════ */
let currentWeekMonday=weekMonday();

function renderDashboard(){
  const dates=weekDates(currentWeekMonday);
  const[s,e]=[dates[0],dates[6]];
  $('week-label').textContent=s.getDate()+' '+MONTH_NAMES[s.getMonth()]+' – '+e.getDate()+' '+MONTH_NAMES[e.getMonth()]+' '+e.getFullYear();
  const goals=macroGoals();
  const container=$('days-grid');
  container.innerHTML='';

  dates.forEach((date,di)=>{
    const key=isoDate(date);
    const dd=S.weekPlan[key]||{slots:[]};
    const isToday=isoDate(new Date())===key;

    let dk=0,dp=0,dc=0,df=0;
    dd.slots.forEach(sid=>{const m=getMeal(sid);if(m){const t=mealTotals(m);dk+=t.kcal;dp+=t.prot;dc+=t.carbs;df+=t.fat;}});

    // Feedback color logic: ±10% = green, below = orange, above = red
    let progClass='prog-neutral', dayStatus='';
    if(goals&&goals.kcal){
      const ratio=dk/goals.kcal;
      if(ratio>=0.9&&ratio<=1.1){progClass='prog-green';dayStatus='day-ok';}
      else if(ratio<0.9){progClass='prog-orange';dayStatus='day-low';}
      else{progClass='prog-red';dayStatus='day-over';}
    }
    const pct=(v,g)=>g?Math.min(100,Math.round(v/g*100)):0;

    const slotsHtml=dd.slots.map((sid,si)=>{
      const m=getMeal(sid);
      if(!m)return`<div class="slot-empty p-2 text-xs text-gray-400 text-center flex items-center justify-center gap-1 min-h-[36px]"
        onclick="window.openSlotPicker('${key}',${si})">
        <i data-lucide="plus" class="w-3 h-3"></i> Añadir</div>`;
      const t=mealTotals(m);
      const catLabel=m.category?`<span class="tag ${CAT_COLORS[m.category]||''} mr-1">${CAT_LABELS[m.category]||''}</span>`:'';
      return`<div class="postit p-2.5 text-xs relative group">
        <div class="font-semibold text-gray-700 truncate pr-10">${catLabel}${m.name}</div>
        <div class="flex items-center justify-between mt-1 gap-1">
          <span class="tag tag-kcal">${fmt(t.kcal)} kcal</span>
          <div class="flex gap-0.5 opacity-0 group-hover:opacity-100 transition">
            <button title="Ver" onclick="event.stopPropagation();window.openMealDetail('${m.id}')"
              class="text-gray-300 hover:text-sage-500 p-0.5"><i data-lucide="eye" class="w-3 h-3"></i></button>
            <button title="Copiar al día siguiente" onclick="event.stopPropagation();window.copySlotToNextDay('${key}',${si})"
              class="text-gray-300 hover:text-amber-500 p-0.5"><i data-lucide="copy" class="w-3 h-3"></i></button>
            <button title="Eliminar" onclick="event.stopPropagation();window.removeSlot('${key}',${si})"
              class="text-gray-300 hover:text-red-400 p-0.5"><i data-lucide="x" class="w-3 h-3"></i></button>
          </div>
        </div>
      </div>`;
    }).join('');

    const barsHtml=goals?`
      <div class="space-y-1.5 mt-2">
        <div class="flex justify-between text-[10px] text-gray-400"><span>Kcal</span><span>${fmt(dk)}/${goals.kcal}</span></div>
        <div class="prog-wrap"><div class="prog-fill ${progClass}" style="width:${pct(dk,goals.kcal)}%"></div></div>
        <div class="flex gap-1">
          <div class="flex-1"><div class="text-[9px] text-gray-400 mb-0.5">HC</div><div class="prog-wrap"><div class="prog-fill prog-neutral" style="width:${pct(dc,goals.carbs)}%"></div></div></div>
          <div class="flex-1"><div class="text-[9px] text-gray-400 mb-0.5">P</div><div class="prog-wrap"><div class="prog-fill prog-green" style="width:${pct(dp,goals.prot)}%"></div></div></div>
          <div class="flex-1"><div class="text-[9px] text-gray-400 mb-0.5">G</div><div class="prog-wrap"><div class="prog-fill prog-orange" style="width:${pct(df,goals.fat)}%"></div></div></div>
        </div>
      </div>`:
      '<p class="text-[10px] text-gray-300 mt-2 text-center">Sin objetivo</p>';

    const col=document.createElement('div');
    col.className='flex flex-col gap-2 '+dayStatus;
    col.innerHTML=`
      <div class="flex items-center justify-between mb-1">
        <div>
          <span class="text-xs font-bold ${isToday?'text-sage-500':'text-gray-500'}">${DAY_NAMES[di]}</span>
          <span class="ml-1 text-[10px] text-gray-300">${date.getDate()}/${date.getMonth()+1}</span>
        </div>
        <div class="flex items-center gap-1">
          ${dayStatus?`<span class="day-header-dot w-1.5 h-1.5 rounded-full inline-block"></span>`:''}
          ${isToday?'<span class="text-[10px] text-sage-400 font-semibold">HOY</span>':''}
        </div>
      </div>
      <div class="space-y-1.5" id="slots-${key}">${slotsHtml}</div>
      <button class="slot-empty py-1.5 text-xs text-gray-400 flex items-center justify-center gap-1 w-full"
        onclick="window.addSlot('${key}')">
        <i data-lucide="plus" class="w-3 h-3"></i> Comida
      </button>
      <div class="postit p-2.5">${barsHtml}</div>`;
    container.appendChild(col);
  });
  refreshUI();updateHeaderKcal();
}

window.addSlot=function(key){
  if(!S.weekPlan[key])S.weekPlan[key]={slots:[]};
  const si=S.weekPlan[key].slots.length;
  S.weekPlan[key].slots.push(null);save();
  renderDashboard();window.openSlotPicker(key,si);
};

window.removeSlot=function(key,si){
  if(!S.weekPlan[key])return;
  S.weekPlan[key].slots.splice(si,1);save();renderDashboard();
};

window.openSlotPicker=function(key,si){
  if(!S.meals.length){toast('Primero crea comidas en "Mis Comidas"');return;}
  const listHtml=S.meals.map(m=>{
    const t=mealTotals(m);
    const catTag=m.category?`<span class="tag ${CAT_COLORS[m.category]||''} ml-1">${CAT_LABELS[m.category]||''}</span>`:'';
    return`<button class="w-full text-left px-4 py-3 hover:bg-sage-50 transition flex items-center justify-between rounded-xl gap-2"
      onclick="window.assignSlot('${key}',${si},'${m.id}')">
      <span class="font-medium text-sm flex items-center gap-1">${m.name}${catTag}</span>
      <span class="tag tag-kcal">${fmt(t.kcal)} kcal</span>
    </button>`;}).join('');
  openModal(`<div class="p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-display text-xl">Elegir comida</h3>
      <button onclick="window.closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="space-y-1 max-h-80 overflow-y-auto">${listHtml}</div>
  </div>`);
};

window.assignSlot=function(key,si,mealId){
  if(!S.weekPlan[key])S.weekPlan[key]={slots:[]};
  S.weekPlan[key].slots[si]=mealId;save();window.closeModal();renderDashboard();
};

window.copySlotToNextDay=function(key,si){
  const dd=S.weekPlan[key];if(!dd)return;
  const mealId=dd.slots[si];if(!mealId)return;
  const d=new Date(key+'T00:00:00');d.setDate(d.getDate()+1);
  const nextKey=isoDate(d);
  if(!S.weekPlan[nextKey])S.weekPlan[nextKey]={slots:[]};
  S.weekPlan[nextKey].slots.push(mealId);save();renderDashboard();
  toast('✓ Copiado al día siguiente');
};

  const totals={};// {name: grams}
  dates.forEach(date=>{
    const dd=S.weekPlan[isoDate(date)];if(!dd)return;
    dd.slots.forEach(sid=>{
      const m=getMeal(sid);if(!m)return;
      (m.ingredients||[]).forEach(ing=>{
        const key=ing.name.toLowerCase().trim();
        totals[key]=(totals[key]||{name:ing.name,grams:0});
        totals[key].grams+=ing.grams;
      });
    });
  });
  const items=Object.values(totals).sort((a,b)=>a.name.localeCompare(b.name));
  if(!items.length){toast('No hay ingredientes en esta semana');return;}

  const listHtml=items.map(it=>`
    <div class="flex items-center justify-between py-2 border-b border-cream-200 last:border-0 text-sm">
      <span class="font-medium text-gray-700">${it.name}</span>
      <span class="tag tag-kcal">${fmt(it.grams)} g</span>
    </div>`).join('');

  const wk=$('week-label').textContent;
  openModal(`<div class="p-6">
    <div class="flex items-center justify-between mb-1">
      <h3 class="font-display text-xl">Lista de la Compra</h3>
      <button onclick="window.closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <p class="text-xs text-gray-400 mb-4">${wk}</p>
    <div class="max-h-[55vh] overflow-y-auto">${listHtml}</div>
    <button onclick="window.copyShoppingListToClipboard()" class="mt-4 w-full py-2 border border-cream-300 rounded-xl text-sm text-gray-500 hover:bg-cream-100 transition flex items-center justify-center gap-1.5">
      <i data-lucide="clipboard-copy" class="w-4 h-4"></i> Copiar al portapapeles
    </button>
  </div>`);
  window._shoppingItems=items;
};

window.copyShoppingListToClipboard=function(){
  const lines=(window._shoppingItems||[]).map(it=>`${it.name}: ${fmt(it.grams)}g`).join('\n');
  navigator.clipboard.writeText(lines).then(()=>toast('✓ Copiado al portapapeles'));
};

function renderMeals(){
  const container=$('meals-list');container.innerHTML='';
  let meals=S.meals;
  if(_mealCatFilter!=='all')meals=meals.filter(m=>m.category===_mealCatFilter);
  if(!meals.length){
    container.innerHTML=`<div class="col-span-3 text-center py-16 text-gray-400 text-sm">
      <i data-lucide="utensils" class="w-8 h-8 mx-auto mb-3 opacity-30"></i>
      <p>${_mealCatFilter==='all'?'Aún no tienes comidas guardadas':'Sin comidas en esta categoría'}</p></div>`;
    refreshUI();return;
  }
  meals.forEach(m=>{
    const t=mealTotals(m);
    const catTag=m.category?`<span class="tag ${CAT_COLORS[m.category]||''}">${CAT_LABELS[m.category]||''}</span>`:'';
    const card=document.createElement('div');

    card.innerHTML=`
      <div class="flex items-start justify-between gap-2">
        <div>
          <div class="mb-1">${catTag}</div>
          <h3 class="font-semibold text-gray-800 text-sm">${m.name}</h3>
        </div>
        <div class="flex gap-1 shrink-0">
          <button title="Duplicar" class="text-gray-300 hover:text-amber-500 transition" onclick="window.duplicateMeal('${m.id}')">
            <i data-lucide="copy" class="w-4 h-4"></i>
          </button>
          <button title="Editar" class="text-gray-300 hover:text-sage-500 transition" onclick="window.openEditMeal('${m.id}')">
            <i data-lucide="pencil" class="w-4 h-4"></i>
          </button>
          <button title="Eliminar" class="text-gray-300 hover:text-red-400 transition" onclick="window.deleteMeal('${m.id}')">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      <div class="flex flex-wrap gap-1">
        <span class="tag tag-kcal">${fmt(t.kcal)} kcal</span>
        <span class="tag tag-prot">${fmt(t.prot)}g P</span>
        <span class="tag tag-hc">${fmt(t.carbs)}g HC</span>

      </div>

window.deleteMeal=function(id){
  S.meals=S.meals.filter(m=>m.id!==id);
  Object.keys(S.weekPlan).forEach(k=>{S.weekPlan[k].slots=S.weekPlan[k].slots.map(s=>s===id?null:s);});
  save();renderMeals();toast('Comida eliminada');
};

window.duplicateMeal=function(id){
  const orig=getMeal(id);if(!orig)return;
  const copy={...orig,id:uid(),name:orig.name+' (copia)',ingredients:[...(orig.ingredients||[]).map(i=>({...i}))]};
  S.meals.push(copy);save();renderMeals();toast('✓ Plato duplicado');
  window.openEditMeal(copy.id);
};

$('btn-new-meal').addEventListener('click',()=>window.openEditMeal(null));

window.openEditMeal=function(mealId){
  const meal=mealId?getMeal(mealId):null;
  window._editorIngs=meal?[...meal.ingredients]:[];
  window._editorMealId=mealId;

  function buildRows(){
    if(!window._editorIngs.length)return'<p class="text-xs text-gray-400 py-2">Sin ingredientes aún</p>';
    return window._editorIngs.map((ing,i)=>`
      <div class="flex items-center justify-between gap-1 py-2 border-b border-cream-200 last:border-0 text-xs">
        <span class="font-medium text-gray-700 flex-1 truncate">${ing.name} (${ing.grams}g)</span>
        <span class="tag tag-kcal">${fmt(ing.kcal)}</span>
        <span class="tag tag-prot">${fmt(ing.prot)}g</span>
        <span class="tag tag-hc">${fmt(ing.carbs)}g</span>
        <span class="tag tag-fat">${fmt(ing.fat)}g</span>
        <button class="text-gray-300 hover:text-red-400 ml-1 shrink-0" onclick="window.removeIngFromEditor(${i})">
          <i data-lucide="x" class="w-3 h-3"></i>
        </button>
      </div>`).join('');
  }

  function renderEditorModal(){
    const ings=window._editorIngs;
    const total=ings.reduce((r,i)=>({kcal:r.kcal+i.kcal,prot:r.prot+i.prot,carbs:r.carbs+i.carbs,fat:r.fat+i.fat}),{kcal:0,prot:0,carbs:0,fat:0});
    const catOpts=['desayuno','comida','cena','snack'].map(c=>`<option value="${c}" ${meal?.category===c?'selected':''}>${CAT_LABELS[c]}</option>`).join('');

    openModal(`<div class="p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-display text-xl">${meal?'Editar':'Nueva'} comida</h3>
        <button onclick="window.closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="flex gap-2 mb-3">
        <input id="meal-name-input" type="text" placeholder="Nombre de la comida" value="${meal?.name||''}"
          class="flex-1 border border-cream-300 rounded-xl px-3 py-2 text-sm bg-cream-50"/>
        <select id="meal-cat-select" class="border border-cream-300 rounded-xl px-3 py-2 text-sm bg-cream-50">
          <option value="">Categoría</option>${catOpts}
        </select>
      </div>

      <!-- Buscador -->
      <div class="mb-3">
        <label class="text-xs text-gray-500 font-semibold mb-1 block flex items-center gap-1">
          <i data-lucide="search" class="w-3 h-3"></i> Buscar ingrediente
          <span class="ml-auto flex gap-1"><span class="badge-basic">Básico</span><span class="badge-saved">Mis alimentos</span></span>
        </label>
        <div class="flex gap-2">
          <input id="ing-search" type="text" placeholder="ej. avena, tofu, lentejas…"
            class="flex-1 border border-cream-300 rounded-xl px-3 py-2 text-sm bg-cream-50"
            onkeydown="if(event.key==='Enter'){event.preventDefault();window.searchIngredient();}"/>
          <button onclick="window.searchIngredient()" class="px-3 py-2 bg-sage-400 text-white rounded-xl hover:bg-sage-500 transition">
            <i data-lucide="search" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="ing-results" class="mt-2 max-h-48 overflow-y-auto space-y-1.5"></div>
      </div>

      <!-- Manual -->
      <details class="mb-4">
        <summary class="text-xs text-gray-400 cursor-pointer hover:text-gray-600 select-none flex items-center gap-1">
          <i data-lucide="plus-circle" class="w-3 h-3"></i> Añadir ingrediente manualmente
        </summary>
        <div class="mt-2 grid grid-cols-2 gap-2 text-xs">
          <input id="mi-name"  placeholder="Nombre" class="border border-cream-300 rounded-xl px-2 py-1.5 bg-cream-50 col-span-2"/>
          <input id="mi-kcal"  type="number" min="0" placeholder="Kcal/100g"   class="border border-cream-300 rounded-xl px-2 py-1.5 bg-cream-50"/>
          <input id="mi-prot"  type="number" min="0" placeholder="Prot/100g"   class="border border-cream-300 rounded-xl px-2 py-1.5 bg-cream-50"/>
          <input id="mi-carbs" type="number" min="0" placeholder="HC/100g"     class="border border-cream-300 rounded-xl px-2 py-1.5 bg-cream-50"/>
          <input id="mi-fat"   type="number" min="0" placeholder="Grasas/100g" class="border border-cream-300 rounded-xl px-2 py-1.5 bg-cream-50"/>
          <input id="mi-grams" type="number" min="1" placeholder="Gramos a añadir" class="border border-cream-300 rounded-xl px-2 py-1.5 bg-cream-50 col-span-2"/>
          <button onclick="window.addManualIngredient()" class="col-span-2 py-1.5 bg-peach-300 text-white rounded-xl hover:bg-peach-400 transition font-semibold">
            Guardar y añadir
          </button>
        </div>
      </details>

      <!-- Lista -->
      <div class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-1">Ingredientes</div>
      <div id="ing-list">${buildRows()}</div>

      <!-- Totales -->
      <div class="mt-3 flex gap-1.5 flex-wrap">
        <span class="tag tag-kcal">${fmt(total.kcal)} kcal</span>
        <span class="tag tag-prot">${fmt(total.prot)}g P</span>
        <span class="tag tag-hc">${fmt(total.carbs)}g HC</span>
        <span class="tag tag-fat">${fmt(total.fat)}g G</span>
      </div>

      <button onclick="window.saveMealFromEditor()"
        class="mt-4 w-full py-2.5 bg-sage-400 text-white rounded-xl text-sm font-bold hover:bg-sage-500 transition">
        Guardar comida
      </button>
    </div>`);
  }

  renderEditorModal();

  window.removeIngFromEditor=function(i){window._editorIngs.splice(i,1);renderEditorModal();};

  window.saveMealFromEditor=function(){
    const name=$('meal-name-input')?.value?.trim();
    if(!name){toast('Pon un nombre a la comida');return;}
    const category=$('meal-cat-select')?.value||'';
    if(meal){meal.name=name;meal.category=category;meal.ingredients=[...window._editorIngs];}
    else{S.meals.push({id:uid(),name,category,ingredients:[...window._editorIngs]});}
    save();window.closeModal();renderMeals();toast('✓ Comida guardada');
  };

  window.addManualIngredient=function(){
    const name=($('mi-name')?.value||'').trim();
    const kcal=parseFloat($('mi-kcal')?.value)||0;
    const prot=parseFloat($('mi-prot')?.value)||0;
    const carbs=parseFloat($('mi-carbs')?.value)||0;
    const fat=parseFloat($('mi-fat')?.value)||0;
    const grams=parseFloat($('mi-grams')?.value)||0;
    if(!name){toast('El nombre es obligatorio');return;}
    if(!grams){toast('Indica los gramos');return;}
    if(!S.customIngredients.some(c=>c.name.toLowerCase()===name.toLowerCase())){
      S.customIngredients.push({id:uid(),name,kcalPer100:kcal,protPer100:prot,carbsPer100:carbs,fatPer100:fat,source:'manual'});
      save();
    }
    const f=grams/100;
    window._editorIngs.push({name,grams,kcal:kcal*f,prot:prot*f,carbs:carbs*f,fat:fat*f});
    renderEditorModal();toast('✓ Ingrediente añadido');
  };

  window.addIngFromSearch=function(data,gramsVal){
    const grams=gramsVal||100,f=grams/100;
    window._editorIngs.push({name:data.name,grams,kcal:(data.kcalPer100||0)*f,prot:(data.protPer100||0)*f,carbs:(data.carbsPer100||0)*f,fat:(data.fatPer100||0)*f});
    renderEditorModal();
  };
};

window.createMenu=function(){
  const name=$('menu-name-input')?.value?.trim();
  const mpd=+($('menu-mpd')?.value||3);
  if(!name){toast('Escribe un nombre');return;}
  const newMenu={id:uid(),name,mealsPerDay:mpd,days:Array.from({length:7},()=>Array(mpd).fill(null))};
  S.menus.push(newMenu);save();window.closeModal();renderMenus();toast('✓ Menú creado');window.editMenu(newMenu.id);
};

window.editMenu=function(menuId){
  const menu=S.menus.find(m=>m.id===menuId);if(!menu)return;
  function renderMenuEditor(){
    let daysHtml='';
    menu.days.forEach((daySlots,di)=>{
      const slotsHtml=daySlots.map((mid,si)=>{
        const m=mid?getMeal(mid):null;
        return`<div class="flex items-center justify-between gap-2 py-1.5 border-b border-cream-200 last:border-0 text-xs">
          <span class="flex-1 truncate font-medium text-gray-600">${m?m.name:'<span class="text-gray-300">—</span>'}</span>
          <button onclick="window.pickMenuSlot('${menuId}',${di},${si})" class="text-gray-300 hover:text-sage-500"><i data-lucide="pencil" class="w-3 h-3"></i></button>
          ${mid?`<button onclick="window.clearMenuSlot('${menuId}',${di},${si})" class="text-gray-300 hover:text-red-400"><i data-lucide="x" class="w-3 h-3"></i></button>`:''}
        </div>`;}).join('');
      daysHtml+=`<div class="mb-3"><div class="text-xs font-bold text-gray-500 mb-1">${DAY_NAMES[di]}</div>
        <div class="bg-cream-50 rounded-xl p-2">${slotsHtml}</div></div>`;
    });
    openModal(`<div class="p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-display text-xl">${menu.name}</h3>
        <button onclick="window.closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="max-h-[58vh] overflow-y-auto">${daysHtml}</div>
      <button onclick="window.closeModal()" class="mt-4 w-full py-2 bg-lavender-400 text-white rounded-xl text-sm font-bold hover:bg-lavender-500 transition">Listo</button>
    </div>`);
  }
  window.pickMenuSlot=function(menuId,di,si){
    const m2=S.menus.find(m=>m.id===menuId);
    if(!m2||!S.meals.length){toast('Crea comidas primero');return;}
    const listHtml=S.meals.map(m=>`
      <button class="w-full text-left px-4 py-3 hover:bg-sage-50 transition flex items-center justify-between rounded-xl"
        onclick="window.assignMenuSlot('${menuId}',${di},${si},'${m.id}')">
        <span class="font-medium text-sm">${m.name}</span>
        <span class="tag tag-kcal">${fmt(mealTotals(m).kcal)} kcal</span>
      </button>`).join('');
    openModal(`<div class="p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-display text-xl">Elegir comida</h3>
        <button onclick="window.editMenu('${menuId}')" class="text-gray-400 hover:text-gray-600"><i data-lucide="arrow-left" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-1 max-h-80 overflow-y-auto">${listHtml}</div>
      <button onclick="window.assignMenuSlot('${menuId}',${di},${si},null)"
        class="mt-3 w-full py-2 text-sm text-gray-400 border border-cream-300 rounded-xl hover:bg-cream-100">Sin comida</button>
    </div>`);
  };
  window.assignMenuSlot=function(menuId,di,si,mealId){
    const m2=S.menus.find(m=>m.id===menuId);if(!m2)return;
    m2.days[di][si]=mealId;save();window.editMenu(menuId);
  };
  window.clearMenuSlot=function(menuId,di,si){
    const m2=S.menus.find(m=>m.id===menuId);if(!m2)return;
    m2.days[di][si]=null;save();window.editMenu(menuId);
  };
  renderMenuEditor();
};

window.applyMenu=function(menuId){
  const menu=S.menus.find(m=>m.id===menuId);if(!menu)return;
  const dates=weekDates(currentWeekMonday);
  menu.days.forEach((daySlots,di)=>{S.weekPlan[isoDate(dates[di])]={slots:[...daySlots]};});
  save();toast('✓ Menú "'+menu.name+'" aplicado');showView('dashboard');
};

$('btn-apply-menu').addEventListener('click',()=>{
  if(!S.menus.length){toast('No tienes menús guardados');return;}

      <span class="font-medium text-sm">${m.name}</span>
      <span class="text-xs text-gray-400">${m.mealsPerDay} comidas/día</span>
    </button>`).join('');
  openModal(`<div class="p-6">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-display text-xl">Aplicar menú</h3>
      <button onclick="window.closeModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>

    <div class="space-y-1">${listHtml}</div>

});

function openModal(html){$('modal-box').innerHTML=html;$('modal-backdrop').classList.remove('hidden');refreshUI();}
window.closeModal=function(){$('modal-backdrop').classList.add('hidden');$('modal-box').innerHTML='';};
$('modal-backdrop').addEventListener('click',e=>{if(e.target===$('modal-backdrop'))window.closeModal();});
